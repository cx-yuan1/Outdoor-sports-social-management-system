<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理 - 管理后台</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo"><span>管理后台</span></div>
            <nav class="admin-menu">
                <a href="/admin" class="admin-menu-item">数据概览</a>
                <a href="/admin/users" class="admin-menu-item">用户管理</a>
                <a href="/admin/activities" class="admin-menu-item">活动管理</a>
                <a href="/admin/categories" class="admin-menu-item">分类管理</a>
                <a href="/admin/moments" class="admin-menu-item">动态管理</a>
                <a href="/admin/banners" class="admin-menu-item">轮播图管理</a>
                <a href="/admin/notices" class="admin-menu-item active">公告管理</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1 class="admin-header-title">公告管理</h1>
                <div class="admin-header-user">
                    <span id="adminName">管理员</span>
                    <a href="javascript:logout()" class="btn btn-outline btn-small">退出</a>
                </div>
            </header>

            <div class="admin-content">
                <div class="card">
                    <div class="search-bar">
                        <button class="btn btn-primary" onclick="openModal()">发布公告</button>
                    </div>

                    <table class="table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>标题</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>发布时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>

                    <div id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal" style="display: none;">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">发布公告</span>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="noticeId">
                <div class="form-group">
                    <label class="form-label">标题 <span class="text-danger">*</span></label>
                    <input type="text" class="form-input" id="noticeTitle" placeholder="请输入公告标题">
                </div>
                <div class="form-group">
                    <label class="form-label">内容 <span class="text-danger">*</span></label>
                    <textarea class="form-input form-textarea" id="noticeContent" placeholder="请输入公告内容" style="min-height: 150px;"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">类型</label>
                    <select class="form-input" id="noticeType">
                        <option value="1">普通公告</option>
                        <option value="2">重要公告</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">状态</label>
                    <select class="form-input" id="noticeStatus">
                        <option value="1">发布</option>
                        <option value="0">下架</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveNotice()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;
        // 存储公告数据，用于编辑时获取
        let noticesData = [];

        // 使用事件委托处理按钮点击
        document.addEventListener('DOMContentLoaded', function() {
            loadNotices(1);
            
            // 使用事件委托，绑定到tbody上
            const tbody = document.getElementById('tableBody');
            if (tbody) {
                tbody.addEventListener('click', function(e) {
                    const btn = e.target.closest('[data-action]');
                    if (!btn) return;
                    
                    const action = btn.getAttribute('data-action');
                    const id = parseInt(btn.getAttribute('data-id'));
                    
                    if (action === 'edit') {
                        e.preventDefault();
                        e.stopPropagation();
                        editNotice(id);
                    } else if (action === 'delete') {
                        e.preventDefault();
                        e.stopPropagation();
                        deleteNotice(id);
                    }
                });
            }
        });

        async function loadNotices(page) {
            currentPage = page;
            const res = await get(`/api/admin/notices?page=${page}&size=${pageSize}`);
            const tbody = document.getElementById('tableBody');
            
            if (res && res.code === 200) {
                const data = res.data;
                noticesData = data.records; // 保存数据
                
                if (data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }
                
                tbody.innerHTML = data.records.map((n, index) => `
                    <tr>
                        <td>${(currentPage - 1) * pageSize + index + 1}</td>
                        <td>${n.title}</td>
                        <td><span class="tag ${n.type === 2 ? 'tag-danger' : 'tag-info'}">${n.type === 2 ? '重要' : '普通'}</span></td>
                        <td><span class="status-tag ${n.status === 1 ? 'status-normal' : 'status-disabled'}">${n.status === 1 ? '已发布' : '已下架'}</span></td>
                        <td>${formatDateTime(n.createdTime)}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-primary btn-small" data-action="edit" data-id="${n.id}">编辑</button>
                                <button class="btn btn-danger btn-small" data-action="delete" data-id="${n.id}">删除</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('pagination').innerHTML = renderPagination(
                    data.current, data.total, pageSize, 'loadNotices'
                );
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">加载失败</td></tr>';
            }
        }

        function openModal() {
            document.getElementById('modalTitle').textContent = '发布公告';
            document.getElementById('noticeId').value = '';
            document.getElementById('noticeTitle').value = '';
            document.getElementById('noticeContent').value = '';
            document.getElementById('noticeType').value = '1';
            document.getElementById('noticeStatus').value = '1';
            document.getElementById('editModal').style.display = 'flex';
        }

        function editNotice(id) {
            // 从保存的数据中查找
            const notice = noticesData.find(n => n.id === id);
            if (!notice) {
                showMessage('数据不存在', 'error');
                return;
            }
            
            document.getElementById('modalTitle').textContent = '编辑公告';
            document.getElementById('noticeId').value = notice.id;
            document.getElementById('noticeTitle').value = notice.title || '';
            document.getElementById('noticeContent').value = notice.content || '';
            document.getElementById('noticeType').value = notice.type || 1;
            document.getElementById('noticeStatus').value = notice.status;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveNotice() {
            const id = document.getElementById('noticeId').value;
            const title = document.getElementById('noticeTitle').value.trim();
            const content = document.getElementById('noticeContent').value.trim();
            const type = parseInt(document.getElementById('noticeType').value);
            const status = parseInt(document.getElementById('noticeStatus').value);
            
            if (!title) {
                showMessage('请输入公告标题', 'error');
                return;
            }
            if (!content) {
                showMessage('请输入公告内容', 'error');
                return;
            }
            
            const data = { title, content, type, status };
            let res;
            
            try {
                if (id) {
                    res = await put(`/api/admin/notice/${id}`, data);
                } else {
                    res = await post('/api/admin/notice', data);
                }
                
                if (res && res.code === 200) {
                    showMessage('保存成功');
                    closeModal();
                    loadNotices(currentPage);
                } else {
                    showMessage(res ? res.message : '保存失败', 'error');
                }
            } catch (error) {
                console.error('保存失败:', error);
                showMessage('保存失败，请稍后重试', 'error');
            }
        }

        async function deleteNotice(id) {
            if (!id) {
                showMessage('参数错误', 'error');
                return;
            }
            
            if (!confirm('确定要删除该公告吗？')) return;
            
            try {
                const res = await del(`/api/admin/notice/${id}`);
                if (res && res.code === 200) {
                    showMessage('删除成功');
                    loadNotices(currentPage);
                } else {
                    showMessage(res ? res.message : '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除失败:', error);
                showMessage('删除失败，请稍后重试', 'error');
            }
        }

        async function logout() {
            await post('/api/logout');
            window.location.href = '/admin/login';
        }
    </script>
</body>
</html>

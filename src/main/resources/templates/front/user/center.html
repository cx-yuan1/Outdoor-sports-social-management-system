<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 户外运动社交平台</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/front.css">
    <style>
        .user-layout { display: flex; gap: 20px; padding: 30px 0; }
        .user-sidebar { width: 200px; }
        .user-main { flex: 1; }
        .user-menu { background: #fff; border-radius: 8px; overflow: hidden; }
        .user-menu a { display: block; padding: 15px 20px; color: var(--text-color); border-left: 3px solid transparent; }
        .user-menu a:hover, .user-menu a.active { background: #e8f5e9; color: var(--primary-color); border-left-color: var(--primary-color); }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-avatar { position: relative; }
        .profile-avatar img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        .profile-avatar input { display: none; }
        .profile-avatar label { position: absolute; bottom: 0; right: 0; width: 30px; height: 30px; background: var(--primary-color); color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 14px; }
        .profile-info h2 { font-size: 20px; margin-bottom: 5px; }
        .profile-stats { display: flex; gap: 30px; margin-top: 10px; }
        .profile-stats span { color: var(--text-secondary); }
        .profile-stats strong { color: var(--text-color); font-size: 18px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand"><span>户外运动社交平台</span></a>
            <ul class="navbar-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/activities">活动</a></li>
                <li><a href="/moments">动态</a></li>
                <li><a href="/notices">公告</a></li>
            </ul>
            <div class="navbar-user" id="navbarUser"></div>
        </div>
    </nav>

    <div class="container">
        <div class="user-layout">
            <aside class="user-sidebar">
                <nav class="user-menu">
                    <a href="/user/center" class="active">个人资料</a>
                    <a href="/user/signups">我的报名</a>
                    <a href="/user/moments">我的动态</a>
                    <a href="/user/messages">我的消息</a>
                </nav>
            </aside>

            <main class="user-main">
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <img id="avatarImg" src="" alt="">
                            <input type="file" id="avatarFile" accept="image/*" onchange="uploadAvatar(this)">
                            <label for="avatarFile">+</label>
                        </div>
                        <div class="profile-info">
                            <h2 id="nickname">-</h2>
                            <p class="text-secondary" id="username">-</p>
                        </div>
                    </div>

                    <form id="profileForm">
                        <div class="form-group">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-input" id="editNickname">
                        </div>
                        <div class="form-group">
                            <label class="form-label">手机号</label>
                            <input type="tel" class="form-input" id="editPhone">
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-input" id="editEmail">
                        </div>
                        <div class="form-group">
                            <label class="form-label">性别</label>
                            <select class="form-input" id="editGender">
                                <option value="0">保密</option>
                                <option value="1">男</option>
                                <option value="2">女</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">个人简介</label>
                            <textarea class="form-input form-textarea" id="editIntro" placeholder="介绍一下自己吧"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </form>
                </div>

                <div class="card mt-20">
                    <h3 class="card-title">修改密码</h3>
                    <form id="passwordForm">
                        <div class="form-group">
                            <label class="form-label">原密码</label>
                            <input type="password" class="form-input" id="oldPassword">
                        </div>
                        <div class="form-group">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-input" id="newPassword">
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认新密码</label>
                            <input type="password" class="form-input" id="confirmPassword">
                        </div>
                        <button type="submit" class="btn btn-primary">修改密码</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            
            document.getElementById('profileForm').addEventListener('submit', saveProfile);
            document.getElementById('passwordForm').addEventListener('submit', changePassword);
        });

        async function loadUserInfo() {
            const res = await get('/api/current-user');
            if (res && res.code === 200 && res.data) {
                currentUser = res.data;
                renderUserInfo();
                renderNavbar();
            } else {
                window.location.href = '/login';
            }
        }

        function renderUserInfo() {
            document.getElementById('avatarImg').src = currentUser.avatar || getDefaultAvatar();
            document.getElementById('nickname').textContent = currentUser.nickname || currentUser.username;
            document.getElementById('username').textContent = '@' + currentUser.username;
            
            document.getElementById('editNickname').value = currentUser.nickname || '';
            document.getElementById('editPhone').value = currentUser.phone || '';
            document.getElementById('editEmail').value = currentUser.email || '';
            document.getElementById('editGender').value = currentUser.gender || 0;
            document.getElementById('editIntro').value = currentUser.intro || '';
        }

        function renderNavbar() {
            document.getElementById('navbarUser').innerHTML = `
                <div class="user-dropdown">
                    <img src="${currentUser.avatar || getDefaultAvatar()}" class="avatar" alt="">
                    <div class="user-dropdown-menu">
                        <a href="/user/center">个人中心</a>
                        ${currentUser.role >= 2 ? '<a href="/organizer/center">发起者中心</a>' : ''}
                        <a href="javascript:logout()">退出登录</a>
                    </div>
                </div>
            `;
        }

        async function uploadAvatar(input) {
            if (input.files && input.files[0]) {
                const url = await uploadFile(input.files[0], 'avatar');
                if (url) {
                    const res = await put('/api/user/profile', { avatar: url });
                    if (res && res.code === 200) {
                        showMessage('头像更新成功');
                        document.getElementById('avatarImg').src = url;
                    }
                }
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            
            const data = {
                nickname: document.getElementById('editNickname').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                email: document.getElementById('editEmail').value.trim(),
                gender: parseInt(document.getElementById('editGender').value),
                intro: document.getElementById('editIntro').value.trim()
            };
            
            const res = await put('/api/user/profile', data);
            if (res && res.code === 200) {
                showMessage('保存成功');
                loadUserInfo();
            } else {
                showMessage(res ? res.message : '保存失败', 'error');
            }
        }

        async function changePassword(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!oldPassword || !newPassword) {
                showMessage('请填写密码', 'error');
                return;
            }
            if (newPassword.length < 6) {
                showMessage('新密码长度不能少于6位', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            const res = await put('/api/user/password', { oldPassword, newPassword });
            if (res && res.code === 200) {
                showMessage('密码修改成功');
                document.getElementById('passwordForm').reset();
            } else {
                showMessage(res ? res.message : '修改失败', 'error');
            }
        }

        async function logout() {
            await post('/api/logout');
            window.location.href = '/';
        }
    </script>
</body>
</html>

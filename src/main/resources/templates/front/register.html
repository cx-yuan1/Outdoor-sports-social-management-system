<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 户外运动社交平台</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/front.css">
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 40px 20px;
        }
        .register-box {
            width: 450px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .register-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .register-box .form-group {
            margin-bottom: 20px;
        }
        .register-box .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }
        .register-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }
        .register-footer a {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-box">
            <h1 class="register-title">用户注册</h1>
            <form id="registerForm" onsubmit="return handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-input" id="username" placeholder="3-20个字符" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-input" id="password" placeholder="至少6位" required>
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="再次输入密码" required>
                </div>
                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" class="form-input" id="nickname" placeholder="不填则使用用户名">
                </div>
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-input" id="phone" placeholder="选填">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">注册</button>
                </div>
            </form>
            <div class="register-footer">
                已有账号？<a href="/login">立即登录</a>
            </div>
            <div class="register-footer" style="margin-top: 10px;">
                <a href="/">返回首页</a>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const nickname = document.getElementById('nickname').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (!username || !password) {
                showMessage('请填写必填项', 'error');
                return false;
            }
            
            if (username.length < 3 || username.length > 20) {
                showMessage('用户名长度应为3-20个字符', 'error');
                return false;
            }
            
            if (password.length < 6) {
                showMessage('密码长度不能少于6位', 'error');
                return false;
            }
            
            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return false;
            }
            
            const res = await post('/api/register', {
                username,
                password,
                nickname: nickname || username,
                phone
            });
            
            if (res && res.code === 200) {
                showMessage('注册成功，请登录');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                showMessage(res ? res.message : '注册失败', 'error');
            }
            
            return false;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动管理 - 户外运动社交平台</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/front.css">
    <style>
        .org-layout {
            display: flex;
            gap: 20px;
            padding: 30px 0;
        }

        .org-sidebar {
            width: 200px;
        }

        .org-main {
            flex: 1;
        }

        .org-menu {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        .org-menu a {
            display: block;
            padding: 15px 20px;
            color: var(--text-color);
            border-left: 3px solid transparent;
        }

        .org-menu a:hover,
        .org-menu a.active {
            background: #e8f5e9;
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }

        .manage-tabs {
            display: flex;
            background: #fff;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid var(--border-color);
        }

        .manage-tab {
            padding: 15px 25px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .manage-tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .manage-content {
            background: #fff;
            border-radius: 0 0 8px 8px;
            padding: 20px;
        }

        .activity-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-cover {
            width: 200px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
        }

        .activity-detail {
            flex: 1;
        }

        .activity-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .activity-meta {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
        }

        .signup-table {
            width: 100%;
        }

        .signup-table th,
        .signup-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .signup-table th {
            background: #f9f9f9;
            font-weight: 600;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .user-cell img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand"><span>户外运动社交平台</span></a>
            <ul class="navbar-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/activities">活动</a></li>
                <li><a href="/moments">动态</a></li>
            </ul>
            <div class="navbar-user" id="navbarUser"></div>
        </div>
    </nav>

    <div class="container">
        <div class="org-layout">
            <aside class="org-sidebar">
                <nav class="org-menu">
                    <a href="/organizer/center">发起者中心</a>
                    <a href="/organizer/publish">发布活动</a>
                    <a href="/organizer/activities" class="active">我的活动</a>
                </nav>
            </aside>

            <main class="org-main">
                <div class="activity-info" id="activityInfo">
                    <div class="loading">加载中...</div>
                </div>

                <div class="manage-tabs">
                    <div class="manage-tab active" data-tab="signups" onclick="switchTab('signups')">报名管理</div>
                    <div class="manage-tab" data-tab="reviews" onclick="switchTab('reviews')">活动评价</div>
                    <div class="manage-tab" data-tab="notify" onclick="switchTab('notify')">发送通知</div>
                </div>

                <div class="manage-content">
                    <div id="signupsPanel">
                        <div class="flex-between mb-15">
                            <span>报名列表</span>
                            <select id="signupStatus" onchange="loadSignups(1)">
                                <option value="">全部状态</option>
                                <option value="0">待审核</option>
                                <option value="1">已通过</option>
                                <option value="2">已拒绝</option>
                            </select>
                        </div>
                        <table class="signup-table">
                            <thead>
                                <tr>
                                    <th>用户</th>
                                    <th>联系方式</th>
                                    <th>报名时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="signupList">
                                <tr>
                                    <td colspan="5" class="loading">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                        <div id="signupPagination" style="padding-top: 15px;"></div>
                    </div>

                    <div id="reviewsPanel" style="display: none;">
                        <div id="reviewList"></div>
                        <div id="reviewPagination" style="padding-top: 15px;"></div>
                    </div>

                    <div id="notifyPanel" style="display: none;">
                        <div class="form-group">
                            <label>通知标题</label>
                            <input type="text" id="notifyTitle" class="form-control" placeholder="请输入通知标题">
                        </div>
                        <div class="form-group">
                            <label>通知内容</label>
                            <textarea id="notifyContent" class="form-control" rows="5" placeholder="请输入通知内容"></textarea>
                        </div>
                        <div class="form-group">
                            <label>发送对象</label>
                            <select id="notifyTarget" class="form-control">
                                <option value="all">所有报名用户</option>
                                <option value="approved">已通过审核的用户</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="sendNotify()">发送通知</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        const activityId = window.location.pathname.split('/').pop();
        let currentTab = 'signups';
        let signupPage = 1, reviewPage = 1;
        const pageSize = 10;

        document.addEventListener('DOMContentLoaded', function () {
            loadUserInfo();
            loadActivityInfo();
            loadSignups(1);
        });

        // 使用事件委托处理按钮点击
        document.getElementById('signupList').addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;

            const action = btn.getAttribute('data-action');
            const id = btn.getAttribute('data-id');

            if (!id || id === 'undefined' || id === 'null') return;

            const numId = parseInt(id);
            if (isNaN(numId)) return;

            if (action === 'approve') {
                auditSignup(numId, 1);
            } else if (action === 'reject') {
                auditSignup(numId, 2);
            }
        });

        async function loadUserInfo() {
            const res = await get('/api/current-user');
            if (res && res.code === 200 && res.data) {
                const user = res.data;
                document.getElementById('navbarUser').innerHTML = `
                    <div class="user-dropdown">
                        <img src="${user.avatar || getDefaultAvatar()}" class="avatar" alt="">
                        <div class="user-dropdown-menu">
                            <a href="/user/center">个人中心</a>
                            <a href="/organizer/center">发起者中心</a>
                            <a href="javascript:logout()">退出登录</a>
                        </div>
                    </div>
                `;
            } else {
                window.location.href = '/login';
            }
        }

        async function loadActivityInfo() {
            const res = await get(`/api/front/activity/${activityId}`);
            if (res && res.code === 200 && res.data) {
                const a = res.data;
                const statusMap = { 0: '待审核', 1: '进行中', 2: '已拒绝', 3: '已结束' };
                document.getElementById('activityInfo').innerHTML = `
                    <img src="${getImageUrl(a.coverImage)}" class="activity-cover" alt="">
                    <div class="activity-detail">
                        <div class="activity-title">${a.title}</div>
                        <div class="activity-meta">
                            <div>活动时间：${formatDate(a.startTime)} - ${formatDate(a.endTime)}</div>
                            <div>活动地点：${a.location || '待定'}</div>
                            <div>报名人数：${a.signupCount || 0}/${a.maxParticipants || '不限'}</div>
                            <div>活动状态：${statusMap[a.status]}</div>
                        </div>
                    </div>
                `;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.manage-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.manage-tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('signupsPanel').style.display = tab === 'signups' ? 'block' : 'none';
            document.getElementById('reviewsPanel').style.display = tab === 'reviews' ? 'block' : 'none';
            document.getElementById('notifyPanel').style.display = tab === 'notify' ? 'block' : 'none';
            if (tab === 'reviews') loadReviews(1);
        }

        async function loadSignups(page) {
            signupPage = page;
            const status = document.getElementById('signupStatus').value;
            let url = `/api/organizer/activity/${activityId}/signups?page=${page}&size=${pageSize}`;
            if (status) url += `&status=${status}`;

            const res = await get(url);
            const tbody = document.getElementById('signupList');

            if (res && res.code === 200) {
                const data = res.data;
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无报名数据</td></tr>';
                    document.getElementById('signupPagination').innerHTML = '';
                    return;
                }

                const statusMap = { 0: '待审核', 1: '已通过', 2: '已拒绝' };
                const statusClass = { 0: 'status-pending', 1: 'status-approved', 2: 'status-rejected' };

                tbody.innerHTML = data.records.map(s => `
                    <tr>
                        <td>
                            <div class="user-cell">
                                <img src="${s.userAvatar || getDefaultAvatar()}" alt="">
                                <span>${s.userNickname || '用户' + s.userId}</span>
                            </div>
                        </td>
                        <td>${s.contactPhone || '-'}</td>
                        <td>${formatTime(s.createdTime)}</td>
                        <td><span class="status-tag ${statusClass[s.status]}">${statusMap[s.status]}</span></td>
                        <td>
                            ${s.status === 0 ? `
                                <div class="action-btns">
                                    <button class="btn btn-primary btn-small" data-action="approve" data-id="${s.id}">通过</button>
                                    <button class="btn btn-danger btn-small" data-action="reject" data-id="${s.id}">拒绝</button>
                                </div>
                            ` : '-'}
                        </td>
                    </tr>
                `).join('');

                document.getElementById('signupPagination').innerHTML = renderPagination(data.current, data.total, pageSize, 'loadSignups');
            }
        }

        async function auditSignup(id, status) {
            console.log('auditSignup called:', id, status);
            const action = status === 1 ? '通过' : '拒绝';
            // 强制直接调用浏览器原生的 confirm，避开任何可能存在的工具函数冲突
            if (!window.confirm(`确定要${action}此报名申请吗？`)) return;

            // 使用PUT方法调用审核接口
            const res = await put(`/api/organizer/signup/${id}/audit`, { status });
            if (res && res.code === 200) {
                showMessage(`已${action}`);
                loadSignups(signupPage);
                loadActivityInfo();
            } else {
                showMessage(res ? res.message : '操作失败', 'error');
            }
        }

        async function loadReviews(page) {
            reviewPage = page;
            const res = await get(`/api/front/activity/${activityId}/reviews?page=${page}&size=${pageSize}`);
            const container = document.getElementById('reviewList');

            if (res && res.code === 200) {
                const data = res.data;
                if (!data.records || data.records.length === 0) {
                    container.innerHTML = '<div class="empty">暂无评价</div>';
                    document.getElementById('reviewPagination').innerHTML = '';
                    return;
                }

                container.innerHTML = data.records.map(r => `
                    <div class="moment-card" style="margin-bottom: 15px;">
                        <div class="moment-header">
                            <img src="${r.userAvatar || getDefaultAvatar()}" class="avatar" alt="">
                            <div class="moment-user-info">
                                <div class="moment-user-name">${r.userNickname || '用户'}</div>
                                <div class="moment-time">${timeAgo(r.createdTime)}</div>
                            </div>
                            <div style="color: #ff9800;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                        </div>
                        <div class="moment-content">${r.content || ''}</div>
                    </div>
                `).join('');

                document.getElementById('reviewPagination').innerHTML = renderPagination(data.current, data.total, pageSize, 'loadReviews');
            }
        }

        async function sendNotify() {
            const title = document.getElementById('notifyTitle').value.trim();
            const content = document.getElementById('notifyContent').value.trim();
            const target = document.getElementById('notifyTarget').value;

            if (!title || !content) {
                showMessage('请填写通知标题和内容', 'warning');
                return;
            }

            const res = await post(`/api/organizer/activity/${activityId}/notify`, { title, content, target });
            if (res && res.code === 200) {
                showMessage('通知发送成功');
                document.getElementById('notifyTitle').value = '';
                document.getElementById('notifyContent').value = '';
            } else {
                showMessage(res ? res.message : '发送失败', 'error');
            }
        }

        async function logout() {
            await post('/api/logout');
            window.location.href = '/';
        }
    </script>
</body>

</html>

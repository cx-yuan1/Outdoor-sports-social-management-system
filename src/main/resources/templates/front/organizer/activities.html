<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的活动 - 户外运动社交平台</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/front.css">
    <style>
        .org-layout { display: flex; gap: 20px; padding: 30px 0; }
        .org-sidebar { width: 200px; }
        .org-main { flex: 1; }
        .org-menu { background: #fff; border-radius: 8px; overflow: hidden; }
        .org-menu a { display: block; padding: 15px 20px; color: var(--text-color); border-left: 3px solid transparent; }
        .org-menu a:hover, .org-menu a.active { background: #e8f5e9; color: var(--primary-color); border-left-color: var(--primary-color); }
        .filter-bar { background: #fff; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        .filter-bar select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; }
        .activity-table { width: 100%; background: #fff; border-radius: 8px; overflow: hidden; }
        .activity-table th, .activity-table td { padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .activity-table th { background: #f9f9f9; font-weight: 600; }
        .activity-table tr:last-child td { border-bottom: none; }
        .activity-cover { width: 80px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand"><span>户外运动社交平台</span></a>
            <ul class="navbar-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/activities">活动</a></li>
                <li><a href="/moments">动态</a></li>
            </ul>
            <div class="navbar-user" id="navbarUser"></div>
        </div>
    </nav>

    <div class="container">
        <div class="org-layout">
            <aside class="org-sidebar">
                <nav class="org-menu">
                    <a href="/organizer/center">发起者中心</a>
                    <a href="/organizer/publish">发布活动</a>
                    <a href="/organizer/activities" class="active">我的活动</a>
                </nav>
            </aside>

            <main class="org-main">
                <div class="filter-bar">
                    <span>状态筛选：</span>
                    <select id="statusFilter" onchange="loadActivities(1)">
                        <option value="">全部</option>
                        <option value="0">待审核</option>
                        <option value="1">已通过</option>
                        <option value="2">已拒绝</option>
                        <option value="3">已结束</option>
                    </select>
                    <div style="flex: 1;"></div>
                    <a href="/organizer/publish" class="btn btn-primary">发布新活动</a>
                </div>

                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>封面</th>
                            <th>活动名称</th>
                            <th>活动时间</th>
                            <th>报名人数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="activityList">
                        <tr><td colspan="6" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
                <div id="pagination" style="padding: 20px; background: #fff;"></div>
            </main>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;

        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadActivities(1);
        });

        async function loadUserInfo() {
            const res = await get('/api/current-user');
            if (res && res.code === 200 && res.data) {
                const user = res.data;
                if (user.role < 2) {
                    showMessage('您没有发起者权限', 'error');
                    setTimeout(() => window.location.href = '/user/center', 1500);
                    return;
                }
                document.getElementById('navbarUser').innerHTML = `
                    <div class="user-dropdown">
                        <img src="${user.avatar || getDefaultAvatar()}" class="avatar" alt="">
                        <div class="user-dropdown-menu">
                            <a href="/user/center">个人中心</a>
                            <a href="/organizer/center">发起者中心</a>
                            <a href="javascript:logout()">退出登录</a>
                        </div>
                    </div>
                `;
            } else {
                window.location.href = '/login';
            }
        }

        async function loadActivities(page) {
            currentPage = page;
            const status = document.getElementById('statusFilter').value;
            let url = `/api/organizer/activities?page=${page}&size=${pageSize}`;
            if (status) url += `&status=${status}`;
            
            const res = await get(url);
            const tbody = document.getElementById('activityList');
            
            if (res && res.code === 200) {
                const data = res.data;
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无活动数据</td></tr>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }
                
                const statusMap = {0: '待审核', 1: '已通过', 2: '已拒绝', 3: '已结束'};
                const statusClass = {0: 'status-pending', 1: 'status-approved', 2: 'status-rejected', 3: 'status-ended'};
                
                tbody.innerHTML = data.records.map(a => `
                    <tr>
                        <td><img src="${getImageUrl(a.coverImage)}" class="activity-cover" alt=""></td>
                        <td>${a.title}</td>
                        <td>${formatDate(a.startTime)}</td>
                        <td>${a.signupCount || 0}/${a.maxParticipants || '不限'}</td>
                        <td><span class="status-tag ${statusClass[a.status]}">${statusMap[a.status]}</span></td>
                        <td>
                            <a href="/organizer/activity/${a.id}" class="btn btn-small">管理</a>
                            ${a.status === 1 ? `<button class="btn btn-small" onclick="endActivity(${a.id})">结束</button>` : ''}
                            ${a.status === 0 ? `<button class="btn btn-danger btn-small" onclick="deleteActivity(${a.id})">删除</button>` : ''}
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('pagination').innerHTML = renderPagination(data.current, data.total, pageSize, 'loadActivities');
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">加载失败</td></tr>';
            }
        }

        async function endActivity(id) {
            if (!confirm('确定要结束此活动吗？结束后将无法再接受报名。')) return;
            const res = await post(`/api/organizer/activity/${id}/end`);
            if (res && res.code === 200) {
                showMessage('活动已结束');
                loadActivities(currentPage);
            } else {
                showMessage(res ? res.message : '操作失败', 'error');
            }
        }

        async function deleteActivity(id) {
            if (!confirm('确定要删除此活动吗？此操作不可恢复。')) return;
            const res = await del(`/api/organizer/activity/${id}`);
            if (res && res.code === 200) {
                showMessage('删除成功');
                loadActivities(currentPage);
            } else {
                showMessage(res ? res.message : '删除失败', 'error');
            }
        }

        async function logout() {
            await post('/api/logout');
            window.location.href = '/';
        }
    </script>
</body>
</html>
